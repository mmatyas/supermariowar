name: Build - Linux
on: workflow_call

jobs:
  linux:
    runs-on: ubuntu-26.04
    name: X11
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ ninja-build zlib1g-dev
          curl -L https://github.com/mmatyas/supermariowar/releases/download/v2.0-beta.0/smwlibs-sdl3-linux.tar.xz | tar xJf - -C /tmp/

      - name: Configure
        run: cmake
          -B build -G Ninja
          -DSMW_INSTALL_PORTABLE=ON
          -DCMAKE_PREFIX_PATH=/tmp/smwlibs
          -DCMAKE_INSTALL_RPATH='$ORIGIN'

      - name: Build
        run: cmake --build build --verbose

      - name: Test
        run: ctest --test-dir build/tests --output-on-failure

      - name: Package
        run: |
          cmake --install build --prefix supermariowar --strip
          rm -rf supermariowar/include supermariowar/lib
          cp /tmp/smwlibs/lib/lib{SDL3,SDL3_image,SDL3_mixer}.so supermariowar/
          zip -9 -r "supermariowar_$(date +%F)_linux.zip" supermariowar

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: supermariowar_linux
          path: supermariowar_*_linux.zip
